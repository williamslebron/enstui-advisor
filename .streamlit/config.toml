[server]
headless = true
enableCORS = false
enableXsrfProtection = false
port = 8080

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"

[theme]
base = "dark"
primaryColor = "#d4af37"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#1a1a2e"
textColor = "#f0f0f0"
font = "sans serif"

[logger]
level = "info"
