# ── cloudbuild.yaml ─────────────────────────────────────────────────────────
# Google Cloud Build CI/CD Pipeline
#
# Triggers automatically on every push to the main branch.
# Flow: build image → push to Artifact Registry → deploy to Cloud Run
#
# Setup once:
#   gcloud builds triggers create github \
#     --repo-name=enstui-advisor \
#     --repo-owner=YOUR_GITHUB_USERNAME \
#     --branch-pattern="^main$" \
#     --build-config=cloudbuild.yaml

substitutions:
  _REGION:       "us-central1"
  _SERVICE_NAME: "enstui-advisor"
  _REPO_NAME:    "enstui-advisor"

steps:

  # ── Step 1: Build the Docker image ────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id:   "build-image"
    args:
      - build
      - "--tag=us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA"
      - "--tag=us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - "--cache-from=us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - "."

  # ── Step 2: Push image to Artifact Registry ───────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id:   "push-image"
    args:
      - push
      - "--all-tags"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}"

  # ── Step 3: Deploy web app to Cloud Run ───────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id:   "deploy-app"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE_NAME}"
      - "--image=us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=1Gi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--concurrency=80"
      - "--timeout=300"
      - "--set-secrets=YOUTUBE_API_KEY=YOUTUBE_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_KEY=SUPABASE_SERVICE_KEY:latest"

  # ── Step 4: Deploy pipeline job to Cloud Run Jobs ─────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id:   "deploy-pipeline-job"
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - "${_SERVICE_NAME}-pipeline"
      - "--image=us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--command=python"
      - "--args=pipeline.py"
      - "--memory=1Gi"
      - "--cpu=1"
      - "--max-retries=3"
      - "--task-timeout=3600"
      - "--set-secrets=YOUTUBE_API_KEY=YOUTUBE_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_KEY=SUPABASE_SERVICE_KEY:latest"

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA"
  - "us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "1200s"
